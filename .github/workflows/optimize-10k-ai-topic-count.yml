name: Optimize 10-K AI Topic Count

on:
  workflow_dispatch:
    inputs:
      min_topics:
        description: "Minimum candidate topic count"
        required: true
        default: "4"
        type: string
      max_topics:
        description: "Maximum candidate topic count"
        required: true
        default: "20"
        type: string
      window_size:
        description: "Sentence window size around each AI keyword sentence"
        required: true
        default: "1"
        type: string
      max_windows_per_doc:
        description: "Maximum AI windows per document; 0 means no cap"
        required: true
        default: "0"
        type: string
      model_name:
        description: "SentenceTransformer model name"
        required: true
        default: "sentence-transformers/all-MiniLM-L6-v2"
        type: string
      tfidf_fallback_only:
        description: "Use TF-IDF KMeans only instead of downloading Sentence-BERT"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      commit_outputs_to_repo:
        description: "Commit optimization outputs to repository"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  optimize-topic-count:
    name: Optimize AI topic count before final topic modeling
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn
          if [ "${{ inputs.tfidf_fallback_only }}" = "false" ]; then
            pip install sentence-transformers
          fi

      - name: Validate input CSV and text files
        run: |
          test -f data/processed/fortune2025_top100_10k_report_linked_text_sample.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path('.')
          rows = list(csv.DictReader(open('data/processed/fortune2025_top100_10k_report_linked_text_sample.csv', encoding='utf-8')))
          missing = [r.get('local_text_path') for r in rows if r.get('local_text_path') and not (root / r.get('local_text_path')).exists()]
          print(f"Rows: {len(rows)}")
          print(f"Missing text files: {len(missing)}")
          if missing:
              print('\n'.join(missing[:20]))
              raise SystemExit('Some local text files referenced in CSV are missing from repository checkout')
          PY

      - name: Run topic count optimization
        run: |
          ARGS="--input-csv data/processed/fortune2025_top100_10k_report_linked_text_sample.csv --min-topics ${{ inputs.min_topics }} --max-topics ${{ inputs.max_topics }} --window-size ${{ inputs.window_size }} --max-windows-per-doc ${{ inputs.max_windows_per_doc }} --model-name ${{ inputs.model_name }}"
          if [ "${{ inputs.tfidf_fallback_only }}" = "true" ]; then
            ARGS="$ARGS --tfidf-fallback-only"
          fi
          python scripts/optimize_10k_ai_topic_count.py $ARGS

      - name: Validate optimization outputs
        run: |
          test -f data/processed/10k_ai_topics/topic_count_optimization.csv
          test -f data/audit/10k_ai_topics/topic_count_recommendation.csv
          echo "Topic count recommendation:"
          cat data/audit/10k_ai_topics/topic_count_recommendation.csv
          echo "Top candidate rows:"
          head -n 10 data/processed/10k_ai_topics/topic_count_optimization.csv

      - name: Commit optimization outputs to repository
        if: ${{ inputs.commit_outputs_to_repo == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/10k_ai_topics/topic_count_optimization.csv \
            data/audit/10k_ai_topics/topic_count_recommendation.csv
          if git diff --cached --quiet; then
            echo "No topic optimization output changes to commit."
          else
            git commit -m "data: add 10-k ai topic count optimization"
            git push
          fi

      - name: Upload optimization outputs
        uses: actions/upload-artifact@v4
        with:
          name: 10k-ai-topic-count-optimization
          if-no-files-found: error
          retention-days: 14
          path: |
            data/processed/10k_ai_topics/topic_count_optimization.csv
            data/audit/10k_ai_topics/topic_count_recommendation.csv
